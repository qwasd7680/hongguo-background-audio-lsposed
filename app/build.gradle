plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.hongguo.backgroundaudio'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.hongguo.backgroundaudio'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Personal/local distribution: produce an APK that can be installed immediately.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
